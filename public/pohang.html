<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183a43"><title>포항 영일대 · 서울 궁 한바퀴</title>
<link rel="icon" href="./palace-icon-192.png"><link rel="stylesheet" href="./pohang.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head>
<body><main id="bay"><canvas id="world" tabindex="0" aria-label="포항 3D 바닷가"></canvas>
<header><div class="place"><small>서울 궁 한바퀴 &nbsp; / &nbsp; 포항</small><strong id="where">포항역</strong></div>
<nav><button id="camera" aria-label="1인칭 전환">시점</button><button id="map-open">지도</button></nav></header>
<p id="hint" role="status" aria-live="polite"></p>
<div id="stick" aria-label="이동 조이스틱"><i></i></div><section id="actions" aria-label="주변 행동"></section>
<form id="chat"><input aria-label="동행에게 말하기" placeholder="동행에게 말하기" maxlength="80" autocomplete="off"><button>전송</button></form>
<dialog id="chart"><header><strong>포항 여행 지도</strong><button id="close-map">닫기</button></header><canvas id="map-view"></canvas><p>포항역 · 영일대해수욕장 · 영일교와 영일대</p><small>지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap 기여자</a> (ODbL) · 야장과 승선장은 게임용 배치</small></dialog>
<section id="boarding" class="cover"><div><small>KTX &nbsp; 경부선 · 동해선</small><h1>포항으로</h1><p id="load-text">포항역에 도착하고 있어요.</p><a id="back" href="./index.html">서울로 돌아가기</a></div></section></main>
<script type="module">import("./pohang.js").catch(()=>{document.querySelector("#boarding").hidden=false;document.querySelector("#load-text").textContent="바닷가를 열지 못했어요. 새로고침하거나 서울로 돌아갈 수 있어요.";});</script></body></html>
